reviews:
  profile: "assertive"

  auto_review:
    enabled: true

  review_status: true

  path_filters:
    - "**/*.swift"
    - "**/*.py"
    - "ios/**"
    - "backend/**"
    - "api/**"

ignore:
  - "node_modules/**"
  - "venv/**"
  - "__pycache__/**"
  - "DerivedData/**"
  - "build/**"
  - "*.log"
  - "*.lock"

# Keep it minimal + valid — CodeRabbit doesn't support deep custom rules yet
