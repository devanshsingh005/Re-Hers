; Supervisor configuration for the Re-Hers backend.
;
; macOS: Copy to /opt/homebrew/etc/supervisor.d/backend.ini
; Ubuntu: Copy to /etc/supervisor/conf.d/backend.conf
;
; Deploy steps:
;   cp supervisor.conf /opt/homebrew/etc/supervisor.d/backend.ini
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start all
;
; Check status:
;   supervisorctl status

[program:fastapi]
directory=/Users/user30/Documents/Re-Hers/backend
command=/Users/user30/Documents/Re-Hers/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
autostart=true
autorestart=true
stderr_logfile=/Users/user30/Documents/Re-Hers/backend/logs/fastapi.err.log
stdout_logfile=/Users/user30/Documents/Re-Hers/backend/logs/fastapi.out.log

[program:worker1]
directory=/Users/user30/Documents/Re-Hers/backend
command=/Users/user30/Documents/Re-Hers/backend/.venv/bin/python worker.py
environment=OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
autostart=true
autorestart=true
stderr_logfile=/Users/user30/Documents/Re-Hers/backend/logs/worker1.err.log
stdout_logfile=/Users/user30/Documents/Re-Hers/backend/logs/worker1.out.log

